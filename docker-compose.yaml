# Camunda 8 "orchestration" para desenvolvimento local (Zeebe + Operate + Tasklist em um so container).
# Baseado no docker-compose lightweight oficial (camunda-distributions 8.10), sem Connectors.
#
#   docker compose up -d
#   Operate:  http://localhost:8080/operate   (usuario/senha: demo/demo)
#   gRPC:     localhost:26500                  (usado pelo camunda-spring-boot-starter)
services:
  camunda-data-init:
    image: camunda/camunda:8.10.9
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1001:1001 /usr/local/camunda/camunda-data && chmod 775 /usr/local/camunda/camunda-data"]
    volumes:
      - camunda-data:/usr/local/camunda/camunda-data
    restart: "no"

  orchestration:
    image: camunda/camunda:8.10.9
    container_name: orchestration
    ports:
      - "26500:26500" # gRPC (client Java / job workers)
      - "8080:8080"   # REST API + Operate + Tasklist
      - "9600:9600"   # management / health
    mem_limit: 1g
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9600 && echo -e \"GET /actuator/health/status HTTP/1.1\r\nHost: localhost\r\n\r\n\" >&3 && head -n 1 <&3'"]
      interval: 2s
      retries: 30
      start_period: 30s
    volumes:
      - camunda:/usr/local/camunda/data
      - camunda-data:/usr/local/camunda/camunda-data
    configs:
      - source: orchestration-config
        target: /usr/local/camunda/config/application.yaml
    depends_on:
      camunda-data-init:
        condition: service_completed_successfully

volumes:
  camunda:
  camunda-data:

configs:
  orchestration-config:
    content: |
      camunda:
        security:
          authentication:
            method: "basic"
            unprotectedApi: true   # o client local nao precisa de credenciais
          authorizations:
            enabled: false
          initialization:
            users:
              - username: "demo"
                password: "demo"
                name: "Demo User"
                email: "demo@demo.com"
            defaultRoles.admin.users:
              - "demo"
        data:
          secondary-storage:     # banco que alimenta o Operate (H2 dentro do container)
            type: rdbms
            rdbms:
              url: jdbc:h2:file:./camunda-data/h2db
              username: sa
              password:
              flushInterval: PT0.5S
              queueSize: 1000
